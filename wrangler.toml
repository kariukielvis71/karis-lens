name = "karis-media-production"
main = "worker/index.js"
compatibility_date = "2024-08-01"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "karis-media-db"
database_id = "local-dev"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "karis-media-media"

[vars]
ADMIN_USER = "admin"

# Set ADMIN_PASSWORD via `wrangler secret put ADMIN_PASSWORD` in production.

[dev]
port = 8080
